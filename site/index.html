<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Noticias</title>
  <meta name="description" content="Barranquilla, Colombia, Países Bajos y el mundo en un solo lugar.">
  <meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Noticias">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="head">
    <div class="greet">
      <h1 id="greeting">Hola</h1>
      <p id="date" class="date"></p>
    </div>
    <button id="refresh" class="pill-btn" type="button" aria-label="Actualizar noticias">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4.5h-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="updated"></span>
    </button>
  </header>

  <main id="main" tabindex="-1">
    <p class="state">Cargando noticias…</p>
  </main>

  <footer class="foot">
    <details id="sources">
      <summary>Fuentes</summary>
      <ul id="sources-list"></ul>
    </details>
  </footer>

  <nav id="tabs" class="dock" role="tablist" aria-label="Secciones"></nav>

  <div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-bar">
      <button id="sheet-close" class="sheet-btn" type="button" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <div class="sheet-heading">
        <div id="sheet-title" class="sheet-title"></div>
        <div class="sheet-hint">¿En blanco? Ese sitio no se deja incrustar: «Abrir ↗»</div>
      </div>
      <a id="sheet-open" class="sheet-open" href="#" target="_blank" rel="noopener noreferrer">Abrir ↗</a>
    </div>
    <div id="sheet-body" class="sheet-body"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
