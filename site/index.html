<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Noticias</title>
  <meta name="description" content="Barranquilla, Colombia, Países Bajos y el mundo en un solo lugar.">
  <meta name="theme-color" content="#14213d" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Noticias">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="bar">
      <h1>Noticias</h1>
      <div class="bar-right">
        <span id="updated" class="updated" aria-live="polite"></span>
        <button id="refresh" class="icon-btn" type="button" aria-label="Actualizar">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4.5h-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
    <nav id="tabs" class="tabs" role="tablist" aria-label="Secciones"></nav>
  </header>

  <main id="main" tabindex="-1">
    <p class="state">Cargando noticias…</p>
  </main>

  <footer class="foot">
    <details id="sources">
      <summary>Fuentes</summary>
      <ul id="sources-list"></ul>
    </details>
  </footer>

  <script src="app.js"></script>
</body>
</html>
